<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJAYHWATA Online Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#111;color:#fff}
header{background:#000;padding:15px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ff00cc}
.logo{width:48px;height:48px;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:8px}
h1{font-family:'Outfit';font-size:18px;display:inline}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;color:#000;border-radius:12px;padding:8px}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#ddd;cursor:pointer}
.card h3{font-size:13px;margin:6px 0;height:32px;overflow:hidden}
.price{color:#8a2be2;font-weight:900}
.btn{width:100%;padding:9px;background:#111;color:#fff;border:none;border-radius:8px;margin-top:5px;font-weight:700}
#cartBtn{position:fixed;bottom:15px;right:15px;background:linear-gradient(90deg,#ff0066,#8a2be2);color:#fff;border:none;border-radius:30px;padding:12px 20px;font-weight:900;z-index:20}
#cartBox{display:none;position:fixed;bottom:70px;left:10px;right:10px;background:#fff;color:#000;border-radius:12px;padding:15px;max-height:60vh;overflow:auto;z-index:30}
#lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:50;align-items:center;justify-content:center;flex-direction:column}
#lightbox img{max-width:90%;max-height:70vh;border-radius:10px}
</style>
</head>
<body>

<header>
<div><span class="logo">PJ</span><h1>PJAYHWATA QUALITY GOODS Online Shop</h1></div>
<p style="font-size:11px;opacity:0.7">RUSAPE - 078 769 5681</p>
</header>

<div class="products" id="products">Loading...</div>

<div id="cartBox">
<h3>Your Cart</h3>
<div id="cartItems" style="margin:10px 0"></div>
<div id="total" style="font-weight:900;color:#8a2be2"></div>
<button class="btn" style="background:#25D366;margin-top:10px" onclick="orderWA()">Order on WhatsApp</button>
<button class="btn" style="background:#eee;color:#000;margin-top:5px" onclick="closeCart()">Close</button>
</div>

<button id="cartBtn" onclick="openCart()">Cart (<span id="count">0</span>)</button>

<div id="lightbox" onclick="closeBox()">
<img id="boxImg" src="">
<p id="boxName" style="color:#fff;margin-top:10px;font-weight:900"></p>
<p id="boxPrice" style="color:#00e5ff"></p>
<p style="color:#aaa;font-size:12px;margin-top:5px">Tap to close</p>
</div>

<script>
var myWA = "263787695681";
var goods = [
 {name:"Stanley Cup(All colors)", price:10, img:"/images/IMG_2676.JPG"},
 {name:"Water bottles 3pcs", price:8, img:"/images/IMG_0229.JPG"},
 {name:"JBL EARPODS", price:10, img:"/images/IMG_0017.JPG"},
 {name:"JBL HEADPHONES", price:12, img:"/images/IMG_9787.JPG"},
 {name:"WATCH+HEADPHONES COMBO", price:20, img:"/images/IMG_0014.JPG"},
 {name:"Womens Garments", price:10, img:"/images/IMG_8808.JPG"},
 {name:"Smart Watch(Full set)",price:15,img:"/images/IMG_4088.JPG"},
 {name:"Mens Formal Shoes",price:25,img:"/images/IMG-20261008-WA0038.jpg"},
 {name:"Formal Shoes",price:30,img:"/images/IMG-20261008-WA0039.jpg"},
 {name:"SMEG CUP", price:10,img:"IMG_6673.JPG"},
 {name:"8pc combo",price:20,img:"/images/IMG_0371.JPG"},
 {name:"FF Perfumes", price:5, img:"/images/IMG_9951.JPG"},
 {name:"TRIPOD STAND",price:15,img:"IMG_0002.JPG"},
 {name:"WOMEN LOAFER",price:20,img:"IMG_8727.JPG"},
 {name:"BRACELETS ",price:5,img:"IMG_7103.JPG"},
 {name:"BRACELETS", price:5,img:"IMG_0096.JPG"},
 {name:"Video kit",price:18,img:"/images/IMG-20261009-WA0023.jpg"},
 {name:"JBL EARPODS",price:10,img:"/images/IMG-20261009-WA0024.jpg"}
];

var cart = [];
var list = document.getElementById('products');

function showProducts(){
 var html = "";
 for(var i=0;i<goods.length;i++){
   html += '<div class="card">';
   html += '<img src="'+goods[i].img+'" onclick="openBox('+i+')" onerror="this.src=\'https://via.placeholder.com/300?text=PJ\'">';
   html += '<h3>'+goods[i].name+'</h3>';
   html += '<p class="price">$'+goods[i].price+'</p>';
   html += '<button class="btn" onclick="addCart('+i+')">Add to Cart</button>';
   html += '</div>';
 }
 list.innerHTML = html;
}

function addCart(i){
 cart.push(goods[i]);
 document.getElementById('count').innerHTML = cart.length;
 renderCart();
 openCart();
}
function renderCart(){
 var html = "";
 var total = 0;
 for(var j=0;j<cart.length;j++){
   html += cart[j].name+' - $'+cart[j].price+' <span style="color:red" onclick="cart.splice('+j+',1);renderCart()">[x]</span><br>';
   total += Number(cart[j].price);
 }
 if(cart.length==0) html = "Cart empty - add products";
 document.getElementById('cartItems').innerHTML = html;
 document.getElementById('total').innerHTML = total>0? "Total: $"+total : "";
 document.getElementById('count').innerHTML = cart.length;
}
function openCart(){ document.getElementById('cartBox').style.display='block'; renderCart(); }
function closeCart(){ document.getElementById('cartBox').style.display='none'; }
function openBox(i){
 document.getElementById('boxImg').src = goods[i].img;
 document.getElementById('boxName').innerHTML = goods[i].name;
 document.getElementById('boxPrice').innerHTML = "$"+goods[i].price;
 document.getElementById('lightbox').style.display='flex';
}
function closeBox(){ document.getElementById('lightbox').style.display='none'; }
function orderWA(){
 if(cart.length==0){ alert("Cart empty"); return; }
 var msg = "Hello PJAYHWATA, I want to place an order:%0A";
 var total = 0;
 for(var k=0;k<cart.length;k++){ msg += "- "+cart[k].name+" $"+cart[k].price+"%0A"; total+=Number(cart[k].price); }
 msg += "%0ATotal: $"+total;
 window.open("https://wa.me/"+myWA+"?text="+msg,"_blank");
}

showProducts();
renderCart();
</script>
</body>
</html>
