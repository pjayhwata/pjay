<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJAYHWATA - Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh}
header{background:#111;color:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:20;border-bottom:3px solid #ff00cc}
.header-top{display:flex;align-items:center;justify-content:center;gap:12px}
.logo-wrap{width:50px;height:50px;border-radius:50%;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:900;font-size:18px;flex-shrink:0;border:2px solid #fff}
header h1{font-family:'Outfit';font-size:17px;font-weight:900;background:linear-gradient(90deg,#ff00cc,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{font-size:11px;opacity:.7;margin-top:2px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:700px;margin:0 auto}
.card{background:#fff;color:#111;border-radius:18px;padding:10px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.card img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#222;display:block}
.card h3{font-family:'Outfit';font-size:13px;margin:8px 0 4px;font-weight:700;height:36px;overflow:hidden;color:#111}
.price{font-family:'Outfit';font-weight:900;font-size:16px;color:#8a2be2}
.btn{width:100%;padding:11px;background:#111;color:#fff;border:none;border-radius:12px;margin-top:6px;font-weight:700;font-size:13px;cursor:pointer}
.btn:active{transform:scale(0.96)}
.btn-whatsapp{background:#25D366}
#cartBtn{position:fixed;bottom:20px;right:20px;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);color:#fff;border:none;border-radius:50px;padding:15px 24px;font-weight:900;box-shadow:0 6px 20px rgba(255,0,204,.5);font-family:'Outfit';z-index:30}
#cartBox{display:none;position:fixed;bottom:80px;right:10px;left:10px;background:#fff;color:#111;border-radius:20px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-height:70vh;overflow:auto;z-index:40;max-width:400px;margin:0 auto}
</style>
</head>
<body>

<header>
<div class="header-top">
<div class="logo-wrap">PJ</div>
<div>
<h1>PJAYHWATA QUALITY GOODS</h1>
<p>RUSAPE • PREMIUM • WHATSAPP 078 769 5681</p>
</div>
</div>
</header>

<div class="products" id="products"></div>

<div id="cartBox">
<h3 style="font-family:'Outfit';font-weight:900">Your Cart 🛒</h3>
<div id="cartItems" style="margin:12px 0;font-size:14px;line-height:1.8"></div>
<p id="total" style="font-weight:900;font-family:'Outfit';font-size:18px;color:#8a2be2"></p>
<button class="btn btn-whatsapp" onclick="orderWhatsApp()">Order on WhatsApp 💬</button>
<button class="btn" onclick="closeCart()" style="background:#eee;color:#111;margin-top:8px">Close</button>
</div>

<button id="cartBtn" onclick="openCart()">Cart (<span id="count">0</span>) ✨</button>

<script>
const myWhatsAppNumber = "263787695681";

const goods = [
 {name:"Stanley Cups", price:10, img:"/images/IMG_0287.JPG"},
 {name:"Water bottles 3pcs combo", price:8, img:"/images/IMG_0229.JPG"},
 {name:"JBL EARPODS", price:10, img:"/images/IMG_0017.JPG"},
 {name:"JBL HEADPHONES", price:12, img:"/images/IMG_9787.JPG"},
 {name:"WATCH AND HEADPHONES COMBO", price:20, img:"/images/IMG_0014.JPG"},
 {name:"Womens Garments", price:10, img:"/images/IMG_8802.JPG"},
 {name:"Smart Watch",price:15,img:"/images/IMG_0016.JPG"},
 {name:"Mens Formal Shoes",price:25,img:"/images/IMG-20261008-WA0039.jpg"},
 {name:"Formal Shoes",price:30,img:"/images/IMG-20261008-WA0040.jpg"},
 {name:"SMEG CUP", price:10,img:"IMG_6673.JPG"},
 {name:"8pc combo",price:20,img:"/images/IMG_0371.JPG"},
 {name:"FF Perfumes", price:5, img:"/images/IMG_9951.JPG"},
 {name:"TRIPOD STAND",price:15,img:"IMG_0002.JPG"},
 {name:"WOMEN'S LOAFER",price:20,img:"IMG_8727.JPG"},
 {name:"WOMEN'S BRACELETS",price:5,img:"IMG_7103.JPG"},
 {name:"BRACELETS", price:5,img:"IMG_0096.JPG"},
];

let cart = [];
const list = document.getElementById('products');

function renderProducts(){
  list.innerHTML = "";
  goods.forEach((g,i)=>{
    // This will show product even if image missing
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${g.img}" alt="${g.name}" onerror="this.src='https://via.placeholder.com/300x300/111/fff?text=PJ+${encodeURIComponent(g.name)}'">
      <h3>${g.name}</h3>
      <p class="price">$${g.price}</p>
      <button class="btn" onclick="addToCart(${i})">Add to Cart</button>
    `;
    list.appendChild(card);
  });
}

function addToCart(i){ 
  cart.push({name: goods[i].name, price: Number(goods[i].price)}); 
  document.getElementById('count').innerText=cart.length; 
  renderCart(); 
}
function renderCart(){
 let html=""; let total=0;
 cart.forEach((c,idx)=>{ 
   html+=`${c.name} - $${c.price} <small onclick="cart.splice(${idx},1);renderCart()" style="color:red;cursor:pointer">[remove]</small><br>`; 
   total+=Number(c.price); 
 });
 document.getElementById('cartItems').innerHTML=html||"Cart empty - Add products";
 document.getElementById('total').innerText= total>0 ? "Total: $"+total : "";
 document.getElementById('count').innerText=cart.length;
}
function openCart(){ document.getElementById('cartBox').style.display='block'; renderCart(); }
function closeCart(){ document.getElementById('cartBox').style.display='none'; }

function orderWhatsApp(){
 if(cart.length==0) return alert("Cart empty - add something first!");
 let msg="Hello PJAYHWATA, I want to order:%0A";
 let total=0;
 cart.forEach(c=>{ msg+=`- ${c.name} $${c.price}%0A`; total+=Number(c.price); });
 msg+=`%0ATotal: $${total}%0AFrom your website`;
 window.open(`https://wa.me/${myWhatsAppNumber}?text=${msg}`, '_blank');
}

// START IMMEDIATELY
renderProducts();
renderCart();
console.log("PJAYHWATA Loaded - Products:", goods.length);
</script>
</body>
</html>
