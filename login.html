<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJAYHWATA - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{margin:0;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f0f;overflow:hidden;position:relative}
body::before,body::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;filter:blur(80px);opacity:.7;animation:move 8s infinite alternate}
body::before{background:radial-gradient(circle,#ff00cc,#3333ff);top:-100px;left:-100px}
body::after{background:radial-gradient(circle,#00ffcc,#ffcc00,#ff0066);bottom:-120px;right:-120px;animation-delay:2s}
@keyframes move{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,60px) scale(1.2)}}
.card{position:relative;z-index:10;background:rgba(255,255,255,0.97);color:#000;width:92%;max-width:400px;border-radius:22px;padding:28px;box-shadow:0 0 40px rgba(255,0,204,.4);text-align:center}
.logo-wrap{width:120px;height:120px;border-radius:50%;margin:0 auto 14px auto;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(255,0,204,0.8);border:3px solid #fff;position:relative;overflow:hidden}
.logo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.logo-text{font-family:'Outfit',sans-serif;font-weight:900;font-size:38px;color:white;letter-spacing:2px}
h1{font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0;text-transform:uppercase}
.sub{color:#555;font-size:13px;margin:10px 0 20px 0;font-weight:600}
.social-btn{width:100%;padding:13px;border:1px solid #e0e0e0;border-radius:14px;margin:7px 0;background:white;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:'Poppins',sans-serif}
.social-btn.facebook{background:#1877F2;color:white;border-color:#1877F2}
.divider{margin:18px 0;display:flex;align-items:center;gap:10px;color:#999;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#ddd}
input{width:100%;padding:14px 16px;border:1.5px solid #e5e5e5;border-radius:14px;margin:7px 0;box-sizing:border-box;font-family:'Poppins',sans-serif;font-size:14px}
.main-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#ff0066,#8a2be2,#00e5ff);color:#fff;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer;letter-spacing:1px;font-family:'Outfit',sans-serif}
</style>
</head>
<body>
<div class="card">

<!-- LOGO WITH 3 FALLBACKS - WILL NEVER BE MISSING -->
<div class="logo-wrap" id="logoWrap">
<img id="pjlogo" src="IMG-20261009-WA6558.jpg" alt="PJ" onerror="this.onerror=null; this.src='logo.png'; this.onerror=function(){this.style.display='none'; document.getElementById('fallbackPJ').style.display='block'}">
<div id="fallbackPJ" class="logo-text" style="display:none">PJ</div>
</div>

<h1>PJAYHWATA QUALITY GOODS</h1>
<div style="font-family:'Outfit';font-weight:700;font-size:12px;letter-spacing:2px;color:#8a2be2;margin-bottom:4px">IN RUSAPE</div>
<div class="sub">✨ Login to view RUSAPE DEALS BY PJAYHWATA ✨</div>

<button class="social-btn google" onclick="socialLogin('Google')"><i class="fab fa-google" style="color:#DB4437"></i> Continue with Google</button>
<button class="social-btn facebook" onclick="socialLogin('Facebook')"><i class="fab fa-facebook"></i> Continue with Facebook</button>

<div class="divider">Or login with email</div>

<input id="name" placeholder="Your Name" required >
<input id="email" type="email" placeholder="Your Email" required>
<input id="phone" placeholder="WhatsApp e.g 077..." required>
<input id="pass" type="password" placeholder="Password: 1234" required>

<button class="main-btn" onclick="go()">ENTER SHOP ✨</button>
<small style="color:#888;display:block;margin-top:14px;font-size:11px">Password: 1234 • Secure Login</small>
</div>

<script>
function socialLogin(p){
  let n=prompt("Enter your name to continue with "+p);
  if(n){localStorage.setItem('pj_user',n);localStorage.setItem('pj_login',p);window.location.href='shop.html';}
}
function go(){
 let n=document.getElementById('name').value.trim();
 let e=document.getElementById('email').value.trim();
 let p=document.getElementById('phone').value.trim();
 let pw=document.getElementById('pass').value.trim();
 if(!n||!e||!p){alert('Fill name, email & WhatsApp');return;}
 if(pw!=='1234'){alert('Wrong password, use 1234');return;}
 localStorage.setItem('pj_user',n);localStorage.setItem('pj_email',e);
 window.location.href='shop.html';
}
</script>
</body>
</html>
