<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJAYHWATA - Login</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;color:#000;width:92%;max-width:380px;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
h1{font-size:18px;margin:0 0 5px 0;line-height:1.3}
.sub{color:#666;font-size:13px;margin-bottom:15px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#000;color:#fff;font-weight:bold;font-size:16px;margin-top:10px}
small{color:#888}
</style>
</head>
<body>
<div class="card">
<h1>PJAYHWATA QUALITY GOODS IN RUSAPE</h1>
<div class="sub">Login to view RUSAPE DEALS</div>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="WhatsApp e.g 077...">
<input id="pass" type="password" placeholder="Password: 1234">
<button onclick="go()">ENTER SHOP</button>
<small>Default password: 1234</small>
</div>

<script>
function go(){
 let n=document.getElementById('name').value.trim();
 let p=document.getElementById('phone').value.trim();
 let pw=document.getElementById('pass').value.trim();
 if(!n || !p){ alert('Enter name & WhatsApp'); return; }
 if(pw !== '1234'){ alert('Wrong password'); return; }
 localStorage.setItem('pj_user', n);
 window.location.href='shop.html';
}
</script>
</body>
</html>
