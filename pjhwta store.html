<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJHWATA QUALITY STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#fafafa]">

<header class="bg-black text-white sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
<h1 class="text-[18px] md:text-xl font-bold tracking-wide">PJHWATA QUALITY STORE</h1>
<a href="https://wa.me/263787695681" class="bg-[#25D366] px-4 py-2 rounded-full text-xs font-bold">WhatsApp</a>
</div>
<!-- SEARCH BAR -->
<div class="bg-black pb-4 px-4">
<div class="max-w-6xl mx-auto">
<div class="relative">
<input id="search" onkeyup="doSearch()" placeholder="Search Stanley, JBL, Perfume..." class="w-full py-3 pl-12 pr-4 rounded-full bg-zinc-800 text-white text-sm outline-none border border-zinc-700 focus:border-white">
<span class="absolute left-4 top-3.5">🔍</span>
</div>
</div>
</div>
</header>

<div class="max-w-6xl mx-auto px-4 mt-4">
<div class="bg-gradient-to-r from-black to-zinc-800 text-white rounded-[20px] p-6 md:p-8 flex flex-col md:flex-row items-center justify-between">
<div>
<h2 class="text-2xl md:text-3xl font-bold">Quality You Can Trust 💯</h2>
<p class="text-zinc-300 mt-2 text-sm">Stanley Cups $10 | JBL | SMEG | Perfumes $5</p>
<p class="mt-2 text-xs bg-white/10 inline-block px-3 py-1 rounded-full">📍 Harare | 🚚 Delivery | 📞 078 769 5681</p>
</div>
<div class="mt-4 md:mt-0 bg-white text-black px-5 py-2 rounded-full font-bold text-sm">From $5!</div>
</div>
</div>

<div class="max-w-6xl mx-auto px-4 mt-6 pb-[100px]">
<h3 id="resultText" class="font-bold text-[15px] mb-3">All Products 🔥</h3>
<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
<div id="noResult" class="hidden text-center py-10 text-zinc-500">No products found for your search</div>
</div>

<!-- CART -->
<div id="cartBox" class="hidden fixed bottom-[85px] left-3 right-3 md:left-auto md:right-6 md:w-[380px] bg-white rounded-[20px] shadow-2xl p-5 z-50 border">
<div class="flex justify-between items-center mb-3"><h3 class="font-bold">Your Cart</h3><button onclick="closeCart()" class="text-zinc-400">✕</button></div>
<div id="cartItems" class="space-y-2 max-h-[280px] overflow-auto text-sm"></div>
<div class="border-t mt-3 pt-3 flex justify-between font-bold"><span>Total</span><span id="total">$0</span></div>
<button onclick="orderWhatsApp()" class="w-full mt-4 bg-[#25D366] text-white py-3 rounded-full font-bold">Order on WhatsApp</button>
</div>

<button id="cartBtn" onclick="openCart()" class="fixed bottom-5 right-5 bg-black text-white px-6 py-4 rounded-full font-bold shadow-xl z-50">🛒 Cart (<span id="count">0</span>)</button>

<script>
const WHATSAPP = "263787695681";
const goods = [
 {name:"Stanley Cup 40oz", price:10, img:"https://images.unsplash.com/photo-1523369364227-2498fdd1d1e0?w=500", badge:"HOT", keywords:"stanley cup tumbler"},
 {name:"3pcs Water Bottle Combo", price:7, img:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500", badge:"COMBO", keywords:"bottle water combo"},
 {name:"Headphones + Watch Combo", price:20, img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500", badge:"COMBO", keywords:"headphones watch jbl combo"},
 {name:"FF Perfume - 25ml", price:5, img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500", badge:"$5", keywords:"perfume ff fragrance"},
 {name:"JBL Headphones P9", price:12, img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", badge:"JBL", keywords:"jbl headphones bluetooth"},
 {name:"JBL Earpods", price:10, img:"/images/IMG_0017.JPG?w=10", badge:"JBL", keywords:"jbl earpods earbuds"},
 {name:"SMEG Cup", price:10, img:"https://images.unsplash.com/photo-1514228742587-6b1558fcf93a?w=500", badge:"NEW", keywords:"smeg cup mug"},
 {name:"More Products Available", price:8, img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500", badge:"MANY MORE", keywords:"more"},
];
let cart=[];
let filtered = [...goods];

function display(list){
 const container=document.getElementById('products');
 container.innerHTML="";
 if(list.length===0){document.getElementById('noResult').classList.remove('hidden'); return;}
 document.getElementById('noResult').classList.add('hidden');
 list.forEach((g)=>{
  const realIndex = goods.indexOf(g);
  container.innerHTML+=`
  <div class="bg-white rounded-[18px] p-3 shadow-sm border border-zinc-100">
   <div class="relative"><img src="${g.img}" class="w-full h-[145px] object-cover rounded-[12px]"><span class="absolute top-2 left-2 bg-black text-white text-[10px] px-2 py-1 rounded-full">${g.badge}</span></div>
   <h3 class="font-semibold text-[13px] mt-3 leading-tight h-[34px]">${g.name}</h3>
   <p class="text-green-600 font-bold mt-1">$${g.price}</p>
   <button onclick="addToCart(${realIndex})" class="w-full mt-2 bg-black text-white py-2.5 rounded-full text-[13px] font-semibold">Add to Cart</button>
  </div>`;
 });
}

function doSearch(){
 const q=document.getElementById('search').value.toLowerCase();
 filtered = goods.filter(g=> (g.name+g.keywords).toLowerCase().includes(q));
 document.getElementById('resultText').innerText = q? `Results for "${q}"` : "All Products 🔥";
 display(filtered);
}

function addToCart(i){cart.push(goods[i]);update();openCart();}
function update(){document.getElementById('count').innerText=cart.length}
function openCart(){document.getElementById('cartBox').classList.remove('hidden');render();}
function closeCart(){document.getElementById('cartBox').classList.add('hidden');}
function render(){
 let html=""; let total=0;
 cart.forEach((c,idx)=>{total+=c.price; html+=`<div class="flex justify-between"><span>${c.name}</span><span>$${c.price} <b onclick="cart.splice(${idx},1);render();update()" class="text-red-500 ml-2 cursor-pointer">x</b></span></div>`});
 document.getElementById('cartItems').innerHTML=html||"Cart is empty";
 document.getElementById('total').innerText="$"+total;
}
function orderWhatsApp(){
 if(!cart.length) return alert("Add items first");
 let msg=`Hello PJHWATA QUALITY STORE! I want to order:%0A%0A`; let total=0;
 cart.forEach(c=>{msg+=`• ${c.name} - $${c.price}%0A`; total+=c.price});
 msg+=`%0ATotal: $${total}%0A%0AMy name: %0ALocation: %0A`;
 window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank');
}
display(goods);
</script>
</body>
</html>
